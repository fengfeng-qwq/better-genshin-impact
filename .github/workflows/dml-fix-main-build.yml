name: DML main fix build

on:
  push:
    branches: [build/dml-fix-main-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Solution Debug build (main AGENTS.md 编译验证)
        run: dotnet build BetterGenshinImpact.sln -c Debug

      - name: Unit tests (InferenceDeviceDiscovery)
        run: dotnet test Test/BetterGenshinImpact.UnitTest/BetterGenshinImpact.UnitTest.csproj -c Release --filter "FullyQualifiedName~InferenceDeviceDiscoveryTests" --logger "console;verbosity=detailed"

      - name: Publish application
        run: dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj -c Release -p:PublishProfile=FolderProfile -p:Version=0.67.2-alpha.2-dmlfix.1

      - name: Collect publish output
        shell: pwsh
        run: |
          $sourceDir = ".\BetterGenshinImpact\bin\x64\Release\net8.0-windows10.0.22621.0\publish\win-x64"
          if (-not (Test-Path $sourceDir)) { throw "publish output not found: $sourceDir" }
          Get-ChildItem -Path $sourceDir -Recurse -Filter "*.pdb" | Remove-Item -Force
          New-Item -Path "dist/BetterGI" -ItemType Directory -Force | Out-Null
          Copy-Item "$sourceDir\*" ".\dist\BetterGI\" -Recurse -Force
          Write-Output "file count: $((Get-ChildItem '.\dist\BetterGI' -Recurse -File).Count)"

      - uses: actions/upload-artifact@v4
        with:
          name: BetterGI-main-dmlfix
          path: dist/BetterGI
